<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4F46E5">
  <title>Кабинет учителя</title>
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 25c-12-8-25-9-39-5v52c14-4 27-3 39 6m0-53c12-8 25-9 39-5v52c-14-4-27-3-39 6m0-53v53' fill='none' stroke='%234F46E5' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      background-color: #F6F8FC;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(99,102,241,.1) 0%, transparent 45%),
        radial-gradient(circle at 90% 15%, rgba(6,182,212,.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(245,158,11,.07) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(168,85,247,.08) 0%, transparent 40%);
      background-attachment: fixed;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: .55;
      z-index: -1;
    }
    .orb-1 { width: min(550px, 90vw); height: 550px; top: -120px; left: -100px; background: radial-gradient(circle, rgba(165,180,252,.7), transparent 70%); }
    .orb-2 { width: min(500px, 90vw); height: 500px; top: 35%; right: 0; background: radial-gradient(circle, rgba(153,246,228,.6), transparent 70%); }
    .orb-3 { width: min(450px, 80vw); height: 450px; bottom: 0; left: 15%; background: radial-gradient(circle, rgba(254,215,170,.55), transparent 70%); }
    .login-card {
      width: 100%;
      max-width: 460px;
      padding: 40px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 32px;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow: 0 16px 36px -10px rgba(99,102,241,.08),
        0 0 1px 1px rgba(255,255,255,.9) inset, 0 4px 16px rgba(15,23,42,.03);
    }
    .login-brand { margin-bottom: 32px; text-align: center; }
    .brand-title { font-size: clamp(24px, 5vw, 30px); font-weight: 800; letter-spacing: -.03em; }
    .form-group { margin-bottom: 20px; }
    .form-label { color: #475569; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .form-control {
      min-height: 52px;
      padding: 13px 16px;
      border: 1px solid rgba(226,232,240,.7);
      border-radius: 18px;
      background: rgba(255,255,255,.65);
      font: inherit;
      box-shadow: 0 1px 0 rgba(255,255,255,.9) inset;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .form-control:focus {
      border-color: #818CF8;
      background: rgba(255,255,255,.9);
      box-shadow: 0 0 0 4px rgba(79,70,229,.08);
      outline: none;
    }
    .btn-primary {
      min-height: 52px;
      border-radius: 9999px;
      font: inherit;
      font-weight: 700;
      background: #4F46E5;
      box-shadow: 0 8px 24px -8px rgba(99,102,241,.35);
    }
    .btn-primary:hover { background: #4338CA; }
    .btn-primary:focus-visible, a:focus-visible { outline: 3px solid #818CF8; outline-offset: 4px; }
    .error-alert {
      display: none;
      background: rgba(254,242,242,.85);
      color: #991B1B;
      border: 1px solid rgba(252,165,165,.7);
      padding: 12px 16px;
      border-radius: 18px;
      font-size: .88rem;
      margin-bottom: 20px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: 32px 24px; border-radius: 24px; }
    }
  </style>
</head>
<body>

  <div class="ambient-orb orb-1" aria-hidden="true"></div>
  <div class="ambient-orb orb-2" aria-hidden="true"></div>
  <div class="ambient-orb orb-3" aria-hidden="true"></div>
  <main class="login-card">
    <div class="login-brand">
      <h1 class="brand-title">Кабинет учителя</h1>
    </div>

    <div id="error-alert" class="error-alert" role="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Имя пользователя (Логин)</label>
        <input type="text" id="username" autocomplete="username" class="form-control" required placeholder="Например: teacher" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <input type="password" id="password" autocomplete="current-password" class="form-control" required placeholder="Введите пароль">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Войти в систему</button>
      </div>

      <div style="margin-top: 1.25rem; text-align: center;">
        <a href="/" style="font-size: 0.85rem; color: var(--text-muted);">← Вернуться на главную страницу сайта</a>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Проверка...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/teacher/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || 'Не удалось выполнить вход');
        }

        // Успешный вход — переходим в кабинет
        window.location.href = '/teacher';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти в систему';
      }
    });
  </script>
</body>
</html>
