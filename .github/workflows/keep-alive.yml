name: Keep Render Server Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -s -f -m 45 https://alasster-cabinet.onrender.com/health || echo "Ping completed"
