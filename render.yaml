services:
  - type: web
    name: alasster-cabinet
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r "Личный кабинет/requirements.txt"
    startCommand: cd "Личный кабинет" && uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: BAGALAU_AUTO_INTERNET
        value: "0"
      - key: TURSO_CABINET_URL
        sync: false
      - key: TURSO_CABINET_TOKEN
        sync: false
      - key: TURSO_GENERATOR_URL
        sync: false
      - key: TURSO_GENERATOR_TOKEN
        sync: false
